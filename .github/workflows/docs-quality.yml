name: Documentation quality

on:
  pull_request:
    paths:
      - "**/*.mdx"
      - "**/*.md"
      - "docs.json"
      - "openapi/**"
      - "examples/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-quality.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.mdx"
      - "**/*.md"
      - "docs.json"
      - "openapi/**"
      - "examples/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation
        run: npm run check
